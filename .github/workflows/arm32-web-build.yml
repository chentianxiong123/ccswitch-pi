name: Web ARM32 Build

on:
  workflow_dispatch:
  push:
    branches:
      - web

env:
  RUST_VERSION: 1.91.1
  NODE_VERSION: '22'

jobs:
  build-web-arm32:
    name: Build Web (Linux armv7 musl)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate
          pnpm --version

      - name: Setup pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: armv7-unknown-linux-musleabihf

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates
          key: armv7-unknown-linux-musleabihf

      - name: Install cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libclang-dev \
            pkg-config

      - name: Install frontend dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build frontend (Web mode)
        shell: bash
        run: pnpm build:web

      - name: Build backend (Release, ARM32)
        shell: bash
        run: cross build --release --target armv7-unknown-linux-musleabihf --manifest-path crates/server/Cargo.toml

      - name: Create release asset
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          ASSET_NAME="cc-switch-web-v${VERSION}-linux-armv7-musl"
          mkdir -p release-assets
          cp crates/server/target/armv7-unknown-linux-musleabihf/release/cc-switch-web "release-assets/${ASSET_NAME}"
          chmod +x "release-assets/${ASSET_NAME}"
          ls -lah release-assets/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-armv7-musl
          path: release-assets/
          retention-days: 7

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/web' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}-web.$(date +%Y%m%d%H%M)"
          ASSET_NAME="cc-switch-web-v${VERSION}-linux-armv7-musl"
          gh release create "$TAG" \
            "release-assets/${ASSET_NAME}" \
            --repo "${{ github.repository }}" \
            --title "Web v${VERSION}" \
            --notes "Auto-built from web branch commit ${{ github.sha }}"
